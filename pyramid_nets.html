<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pyramid Nets Lab</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Arial,sans-serif;background:#eef3fa;color:#1d2b3a}
header{background:#1f4e8c;color:#fff;padding:10px 16px}
h1{margin:0;font-size:20px}header p{margin:2px 0 0;font-size:13px;opacity:.9}
.wrap{max-width:1000px;margin:auto;padding:10px}
button{font:inherit;cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tab{padding:7px 12px;border:2px solid #1f4e8c;background:#fff;color:#1f4e8c;border-radius:20px;font-weight:600;font-size:14px}
.tab.on{background:#1f4e8c;color:#fff}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.panels{grid-template-columns:1fr}}
.card{background:#fff;border-radius:12px;padding:8px;box-shadow:0 1px 4px #0003}
.card h2{margin:2px 4px 6px;font-size:15px}
svg#net,canvas{width:100%;height:auto;display:block;touch-action:none}
canvas{cursor:grab;border-radius:8px;background:#f8fbff}
.slot{fill:#fff;stroke:#7a8aa0;stroke-width:2;stroke-dasharray:6 4;cursor:pointer}
.slot:hover{fill:#fff6dc}
.slot.lock{stroke:#1d2b3a;stroke-dasharray:none;cursor:default}
.slot.bad{animation:sh .4s;fill:#ffd6d6}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ctl{display:flex;gap:8px;align-items:center;padding:4px}
.ctl input{flex:1}
.btn{padding:7px 14px;border:0;border-radius:8px;background:#1f4e8c;color:#fff;font-weight:600}
.btn.alt{background:#d9534f}
#tray{display:flex;flex-wrap:wrap;gap:8px;min-height:80px;padding:4px}
.piece{background:#f5f8fc;border:3px solid #b8c6da;border-radius:10px;padding:6px;text-align:center;font-size:11px}
.piece.sel{border-color:#f2a93b;background:#fff3d6}
.piece svg{display:block;margin:auto}
#msg{min-height:24px;padding:6px 4px;font-weight:600}
#msg.ok{color:#1b7f3b}#msg.no{color:#c0392b}
.info{font-size:13px;padding:2px 6px;color:#455}
</style></head><body>
<header><h1>Pyramid Nets Lab</h1><p>Pick a pyramid, choose the correct shapes from the tray and place them on the net. Then fold it!</p></header>
<div class="wrap">
 <div class="tabs" id="tabs"></div>
 <div class="card" style="margin-bottom:10px"><h2>Shape tray – tap a shape, then tap where it belongs on the net</h2>
  <div id="tray"></div><div id="msg"></div>
  <button class="btn alt" id="reset">↺ Reset</button></div>
 <div class="panels">
  <div class="card"><h2>2D Net – place the shapes</h2><svg id="net" viewBox="0 0 420 420"></svg>
   <div class="info" id="prog"></div></div>
  <div class="card"><h2>3D View – fold the net (drag to rotate)</h2><canvas id="cv" width="840" height="840"></canvas>
   <div class="ctl"><span>Flat</span><input type="range" id="sl" min="0" max="100" value="0"><span>Folded</span>
   <button class="btn" id="fold">▶ Fold</button></div>
   <div class="info" id="fev"></div></div>
 </div>
</div>
<script>
const $=id=>document.getElementById(id),SV='http://www.w3.org/2000/svg';
const PY=[{name:'Triangular pyramid (Tetrahedron)',n:3,h:Math.sqrt(2/3)},{name:'Square pyramid',n:4,h:1},
 {name:'Rectangular pyramid',n:4,h:1.1,rect:1},{name:'Pentagonal pyramid',n:5,h:1.2},{name:'Hexagonal pyramid',n:6,h:1.4}];
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function reg(n,s=1){const R=s/(2*Math.sin(Math.PI/n)),t=-Math.PI/2-Math.PI/n;return Array.from({length:n},(_,i)=>[R*Math.cos(t+2*Math.PI*i/n),R*Math.sin(t+2*Math.PI*i/n)])}
const sig=p=>p.length+':'+p.map((v,i)=>dist(v,p[(i+1)%p.length]).toFixed(2)).sort().join(',');
function nm(p){const n=p.length,u=new Set(p.map((v,i)=>dist(v,p[(i+1)%n]).toFixed(2))).size;
 if(n==3)return['Equilateral triangle','Isosceles triangle','Scalene triangle'][u-1];
 return n==4?(u==1?'Square':'Rectangle'):n==5?'Pentagon':'Hexagon'}
const POOL=()=>[{name:'Right triangle',poly:[[0,0],[1,0],[0,1.1]]},{name:'Isosceles triangle',poly:[[0,0],[1.4,0],[.7,.6]]},
 {name:'Parallelogram',poly:[[0,0],[1,0],[1.5,.8],[.5,.8]]},{name:'Trapezium',poly:[[0,0],[1.4,0],[1.05,.8],[.35,.8]]},
 {name:'Equilateral triangle',poly:reg(3)},{name:'Square',poly:reg(4)},{name:'Rectangle',poly:[[0,0],[1.3,0],[1.3,.8],[0,.8]]},
 {name:'Pentagon',poly:reg(5)},{name:'Hexagon',poly:reg(6)}];
const shuf=a=>a.sort(()=>Math.random()-.5);
const col=i=>i==0?'#f2a93b':`hsl(${190+i*28},68%,66%)`;

let cur=0,F=[],placed=[],tray=[],sel=null,t=0,raf=0,yaw=.6,pit=.85,K=1,ox=0,oy=0,H=1;

function build(p){
 const P=p.rect?[[-.8,-.5],[.8,-.5],[.8,.5],[-.8,.5]]:reg(p.n),n=P.length;H=p.h;
 F=[{poly:P,base:1}];
 for(let i=0;i<n;i++){const A=P[i],B=P[(i+1)%n],dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy),nx=dy/L,ny=-dx/L,
  mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2,a=mx*nx+my*ny,s=Math.hypot(H,a);
  F.push({poly:[A,B,[mx+nx*s,my+ny*s]],A,B,nx,ny,mx,my,a,s})}
}
function norm(poly){const a=Math.atan2(poly[1][1]-poly[0][1],poly[1][0]-poly[0][0]),c=Math.cos(-a),s=Math.sin(-a);
 let q=poly.map(([x,y])=>[x*c-y*s,-(x*s+y*c)]);const mx=Math.min(...q.map(v=>v[0])),my=Math.min(...q.map(v=>v[1]));
 q=q.map(v=>[v[0]-mx,v[1]-my]);return{q,w:Math.max(...q.map(v=>v[0])),h:Math.max(...q.map(v=>v[1]))}}

function load(i){
 cur=i;sel=null;t=0;cancelAnimationFrame(raf);build(PY[i]);placed=F.map(()=>0);
 const need=F.map(f=>sig(f.poly)),needSet=new Set(need);
 tray=F.map((f,j)=>({sig:need[j],poly:f.poly,name:nm(f.poly),used:0}));
 shuf(POOL().filter(d=>!needSet.has(sig(d.poly)))).slice(0,3).forEach(d=>tray.push({sig:sig(d.poly),poly:d.poly,name:d.name,used:0}));
 shuf(tray);tray.forEach((p,k)=>p.id=k);
 // net layout
 const pts=F.flatMap(f=>f.poly),xs=pts.map(p=>p[0]),ys=pts.map(p=>-p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
 K=Math.min(370/(x1-x0),370/(y1-y0));ox=210-K*(x0+x1)/2;oy=210-K*(y0+y1)/2;
 drawNet();drawTray();$('sl').value=0;setMsg('Tap a shape in the tray to begin.','');upd();draw();
 [...$('tabs').children].forEach((b,k)=>b.classList.toggle('on',k==i));
 const n=PY[i].n;$('fev').textContent=`Faces: ${n+1}  •  Edges: ${2*n}  •  Vertices: ${n+1}`;
}
const pt=p=>((p[0]*K+ox).toFixed(1))+','+((-p[1]*K+oy).toFixed(1));
function drawNet(){
 const s=$('net');s.innerHTML='';
 F.forEach((f,j)=>{const e=document.createElementNS(SV,'polygon');e.setAttribute('points',f.poly.map(pt).join(' '));
  e.setAttribute('class','slot');e.id='s'+j;e.onclick=()=>place(j);s.appendChild(e)});
}
function drawTray(){
 const T=$('tray');T.innerHTML='';
 const g=tray.map(p=>norm(p.poly)),mx=Math.max(...g.map(o=>Math.max(o.w,o.h))),k=Math.min(K*.55,105/mx);
 tray.forEach((p,i)=>{if(p.used)return;const o=g[i],d=document.createElement('div');d.className='piece'+(sel===p.id?' sel':'');
  d.innerHTML=`<svg width="${o.w*k+6}" height="${o.h*k+6}"><polygon points="${o.q.map(v=>(v[0]*k+3).toFixed(1)+','+(v[1]*k+3).toFixed(1)).join(' ')}" fill="#7fb3e6" stroke="#1d2b3a" stroke-width="2"/></svg>${p.name}`;
  d.onclick=()=>{sel=sel===p.id?null:p.id;setMsg(sel===null?'':'Now tap the place on the net where it fits.','');drawTray()};T.appendChild(d)});
}
function setMsg(m,c){$('msg').textContent=m;$('msg').className=c}
function place(j){
 if(placed[j])return;
 if(sel===null){setMsg('Pick a shape from the tray first.','no');return}
 const p=tray[sel],e=$('s'+j);
 if(p.sig===sig(F[j].poly)){placed[j]=1;p.used=1;sel=null;e.classList.add('lock');e.style.fill=col(j);
  const c=placed.filter(x=>x).length;
  if(c==F.length){setMsg('🎉 Net complete! Watch it fold into a pyramid.','ok');setTimeout(()=>go(1),500)}
  else setMsg('✔ Correct – locked in place!','ok');
  drawTray();upd();draw()}
 else{e.classList.remove('bad');void e.getBBox();e.classList.add('bad');setTimeout(()=>e.classList.remove('bad'),450);
  setMsg('✘ That shape does not fit here. Compare the sides and number of edges.','no')}
}
function upd(){$('prog').textContent=`Shapes placed: ${placed.filter(x=>x).length} / ${F.length}`}

// 3D
const cv=$('cv'),cx=cv.getContext('2d');cx.scale(2,2);
function v3(f,j){
 if(j==0)return f.poly.map(p=>[p[0],p[1],0]);
 const th=t*(Math.PI-Math.atan2(H,f.a)),c=Math.cos(th),s=Math.sin(th);
 return[[f.A[0],f.A[1],0],[f.B[0],f.B[1],0],[f.mx+f.nx*f.s*c,f.my+f.ny*f.s*c,f.s*s]];
}
function proj(p){const cy=Math.cos(yaw),sy=Math.sin(yaw),x=p[0]*cy-p[1]*sy,y=p[0]*sy+p[1]*cy;
 return[x,p[2]*Math.cos(pit)+y*Math.sin(pit),y*Math.cos(pit)-p[2]*Math.sin(pit)]}
function draw(){
 cx.clearRect(0,0,420,420);
 const items=F.map((f,j)=>{const q=v3(f,j).map(proj);return{j,q,d:q.reduce((a,b)=>a+b[2],0)/q.length}}).sort((a,b)=>b.d-a.d);
 let m=.01;items.forEach(o=>o.q.forEach(p=>{m=Math.max(m,Math.abs(p[0]),Math.abs(p[1]))}));
 const k=185/m;
 items.forEach(o=>{cx.beginPath();o.q.forEach((p,i)=>{const X=210+p[0]*k,Y=225-p[1]*k;i?cx.lineTo(X,Y):cx.moveTo(X,Y)});cx.closePath();
  if(placed[o.j]){cx.globalAlpha=.93;cx.fillStyle=col(o.j);cx.fill();cx.globalAlpha=1;cx.setLineDash([]);cx.strokeStyle='#1d2b3a';cx.lineWidth=2}
  else{cx.fillStyle='rgba(140,155,180,.15)';cx.fill();cx.setLineDash([5,4]);cx.strokeStyle='#9aa8bc';cx.lineWidth=1.5}
  cx.stroke();cx.setLineDash([])});
 cx.fillStyle='#667';cx.font='12px sans-serif';cx.fillText(t>=.99?'Folded':t<=.01?'Flat net':'Folding… '+Math.round(t*100)+'%',8,16);
}
function go(to){cancelAnimationFrame(raf);const f=t,st=performance.now(),D=2200*Math.abs(to-f)+1;
 (function s(now){const u=Math.min(1,(now-st)/D);t=f+(to-f)*u;$('sl').value=t*100;draw();$('fold').textContent=t>.5?'◀ Unfold':'▶ Fold';if(u<1)raf=requestAnimationFrame(s)})(st)}
$('fold').onclick=()=>go(t>.5?0:1);
$('sl').oninput=e=>{cancelAnimationFrame(raf);t=e.target.value/100;$('fold').textContent=t>.5?'◀ Unfold':'▶ Fold';draw()};
let dr=null;
cv.onpointerdown=e=>{dr=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)};
cv.onpointerup=()=>dr=null;
cv.onpointermove=e=>{if(!dr)return;yaw+=(e.clientX-dr[0])*.01;pit=Math.max(.1,Math.min(1.5,pit+(e.clientY-dr[1])*.01));dr=[e.clientX,e.clientY];draw()};
$('reset').onclick=()=>load(cur);
PY.forEach((p,i)=>{const b=document.createElement('button');b.className='tab';b.textContent=p.name;b.onclick=()=>load(i);$('tabs').appendChild(b)});
load(0);
</script></body></html>
